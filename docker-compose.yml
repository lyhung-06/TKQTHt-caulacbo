name: club

services:
  db:
    image: mysql:8.0.39
    container_name: club-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-club_management}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/mysqld:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-app-init:
    image: mysql:8.0.39
    container_name: club-db-app-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-club_management}
      DB_USER: ${DB_USER:-club_user}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./scripts/create-db-app-user.sh:/scripts/create-db-app-user.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-db-app-user.sh"]
    networks:
      - backend
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  db-monitor-init:
    image: mysql:8.0.39
    container_name: club-db-monitor-init
    restart: "no"
    depends_on:
      db-app-init:
        condition: service_completed_successfully
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_MONITOR_USER: ${DB_MONITOR_USER:?Set DB_MONITOR_USER in .env}
      DB_MONITOR_PASSWORD: ${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD in .env}
      DB_USER: ${DB_USER:-club_user}
    volumes:
      - ./scripts/create-db-monitor-user.sh:/scripts/create-db-monitor-user.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-db-monitor-user.sh"]
    networks:
      - backend
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  db-seed-passwords:
    image: club-web:1.0.0
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: club-db-seed-passwords
    restart: "no"
    depends_on:
      db-app-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-club_management}
      DB_USER: ${DB_USER:-club_user}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      OFFICER_INITIAL_PASSWORD: ${OFFICER_INITIAL_PASSWORD:?Set OFFICER_INITIAL_PASSWORD in .env}
      MEMBER_INITIAL_PASSWORD: ${MEMBER_INITIAL_PASSWORD:?Set MEMBER_INITIAL_PASSWORD in .env}
    command: ["node", "scripts/configure-seed-passwords.js"]
    networks:
      - backend
    user: "node"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  db-hardening-check:
    image: mysql:8.0.39
    container_name: club-db-hardening-check
    profiles:
      - verify
    restart: "no"
    depends_on:
      db-monitor-init:
        condition: service_completed_successfully
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-club_management}
      DB_USER: ${DB_USER:-club_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MONITOR_USER: ${DB_MONITOR_USER:?Set DB_MONITOR_USER in .env}
      DB_MONITOR_PASSWORD: ${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD in .env}
    volumes:
      - ./scripts/test-db-grants.sh:/scripts/test-db-grants.sh:ro
    entrypoint: ["/bin/sh", "/scripts/test-db-grants.sh"]
    networks:
      - backend
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  web:
    image: club-web:1.0.0
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: club-web
    restart: unless-stopped
    depends_on:
      db-app-init:
        condition: service_completed_successfully
      db-seed-passwords:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-club_management}
      DB_USER: ${DB_USER:-club_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      USE_HTTPS: "true"
      TZ: Asia/Ho_Chi_Minh
    networks:
      - frontend
      - backend
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.26.2-alpine
    container_name: club-nginx
    restart: unless-stopped
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      web:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "${HOST_HTTP_PORT:-80}:8080"
      - "${HOST_HTTPS_PORT:-443}:8443"
      - "127.0.0.1:3000:8082"
      - "127.0.0.1:9090:8083"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - proxy_metrics
      - monitoring
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: club-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    pids_limit: 128

  grafana:
    image: grafana/grafana:11.2.0
    container_name: club-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://${GRAFANA_DOMAIN:-localhost}:${HOST_HTTPS_PORT:-443}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1
    pids_limit: 128

  loki:
    image: grafana/loki:3.1.1
    container_name: club-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    pids_limit: 128

  promtail:
    image: grafana/promtail:3.1.1
    container_name: club-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - monitoring
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  alert-sink:
    build:
      context: ./alert-sink
      dockerfile: Dockerfile
    image: club-alert-sink:1.0.0
    container_name: club-alert-sink
    restart: unless-stopped
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: club-cadvisor
    restart: unless-stopped
    privileged: false
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: club-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - monitoring
      - proxy_metrics
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: club-mysqld-exporter
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'umask 077; printf "[client]\nuser=%s\npassword=%s\nhost=db\n" "$$DB_MONITOR_USER" "$$DB_MONITOR_PASSWORD" > /tmp/.my.cnf; exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf'
    environment:
      DB_MONITOR_USER: ${DB_MONITOR_USER:?Set DB_MONITOR_USER in .env}
      DB_MONITOR_PASSWORD: ${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD in .env}
    depends_on:
      db-monitor-init:
        condition: service_completed_successfully
    networks:
      - backend
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: club-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

volumes:
  db_data:
    name: club_mysql_data
  prometheus_data:
    name: club_prometheus_data
  grafana_data:
    name: club_grafana_data
  loki_data:
    name: club_loki_data
  promtail_positions:
    name: club_promtail_positions

networks:
  frontend:
    name: club_frontend
    driver: bridge
  backend:
    name: club_backend
    driver: bridge
    internal: true
  monitoring:
    name: club_monitoring
    driver: bridge
    internal: true
  proxy_metrics:
    name: club_proxy_metrics
    driver: bridge
    internal: true
