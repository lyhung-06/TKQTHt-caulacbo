global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:3000"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: database
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
